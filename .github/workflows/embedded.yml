name: Embedded APK

# Builds the self-contained APK: an in-process native server (libreborn.so)
# plus a redirect patch so the game talks to 127.0.0.1 — no PC, no server,
# no internet. Signs with the keystore committed at tools/build/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: reborn-3.4.7
      GH_TOKEN: ${{ github.token }}
      IL2CPP_SHA: fee1ef4ec69a9cf00e1d12e53b5581ee34e17c542cb05e379c0a87f070686875
    steps:
      - uses: actions/checkout@v4

      - name: Install patchelf
        run: sudo apt-get update -q && sudo apt-get install -y -q patchelf

      - name: Compile libreborn.so (arm64-v8a) with the NDK
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          echo "NDK=$NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$CC" -shared -fPIC -O2 -s native/reborn_embedded/reborn_server.c -o libreborn.so
          file libreborn.so

      - name: Patch libil2cpp.so (redirect + anti-tamper noop + NEEDED libreborn.so)
        run: |
          set -e
          mkdir -p work
          unzip -o -q dist/SpecialSoldier-reborn-3.4.7.apk "lib/arm64-v8a/libil2cpp.so" -d work
          SO=work/lib/arm64-v8a/libil2cpp.so
          echo "$IL2CPP_SHA  $SO" | sha256sum -c
          python3 tools/build/patch_redirect.py "$SO" 0x1d382d4 0x189b254 42427
          # GameManager.OnInjectionDetected -> ret (stops the INJECT DLL report + force-exit)
          python3 tools/build/patch_noop.py "$SO" 0x1c77dc8
          patchelf --add-needed libreborn.so "$SO"
          readelf -dW "$SO" | grep -i needed | head

      - name: Assemble + sign the embedded APK
        run: |
          set -e
          python3 tools/build/build_embedded.py \
            dist/SpecialSoldier-reborn-3.4.7.apk \
            dist/main.347.com.wellgames.ss.obb \
            work/lib/arm64-v8a/libil2cpp.so \
            libreborn.so \
            embedded-unsigned.apk
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which jarsigner)")")")" \
            bash tools/build/repack_sign.sh embedded-unsigned.apk \
            SpecialSoldier-reborn-3.4.7-embedded.apk \
            tools/build/reborn-release.keystore reborn2024 reborn
          ls -l SpecialSoldier-reborn-3.4.7-embedded.apk

      - name: Attach to release
        run: gh release upload "$TAG" SpecialSoldier-reborn-3.4.7-embedded.apk --clobber
