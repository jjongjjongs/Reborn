name: Embedded APK

# Builds the self-contained APK: an in-process native server (libreborn.so)
# plus a redirect patch so the game talks to 127.0.0.1 — no PC, no server,
# no internet. Signs with the keystore committed at tools/build/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: reborn-3.4.7
      GH_TOKEN: ${{ github.token }}
      IL2CPP_SHA: fee1ef4ec69a9cf00e1d12e53b5581ee34e17c542cb05e379c0a87f070686875
    steps:
      - uses: actions/checkout@v4

      - name: Install patchelf
        run: sudo apt-get update -q && sudo apt-get install -y -q patchelf

      - name: Compile libreborn.so (arm64-v8a) with the NDK
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          echo "NDK=$NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$CC" -shared -fPIC -O2 -s native/reborn_embedded/reborn_server.c -o libreborn.so
          file libreborn.so

      - name: Patch libil2cpp.so
        run: |
          set -e
          mkdir -p work
          unzip -o -q dist/SpecialSoldier-reborn-3.4.7.apk "lib/arm64-v8a/libil2cpp.so" -d work
          SO=work/lib/arm64-v8a/libil2cpp.so
          echo "$IL2CPP_SHA  $SO" | sha256sum -c
          # base URL -> embedded localhost server
          python3 tools/build/patch_redirect.py "$SO" 0x1d382d4 0x189b254 42427
          # GameManager.OnInjectionDetected -> ret (no INJECT DLL report / force-exit)
          python3 tools/build/patch_noop.py "$SO" 0x1c77dc8
          # GPlayServiceManager.Connect -> false, GoogleSignIn -> ret (no Google activity)
          python3 tools/build/patch_noop.py "$SO" --ret0 0x1ceaec0
          python3 tools/build/patch_noop.py "$SO" 0x1ceb430
          # Nexon security module (NGSM): neutralize its native engine entries so
          # the Java/native CallStatic never runs (re-signed APK would trip it).
          #  Ngsm.NGSM.ngsmInit -> ret   (startup; no direct C# caller = fire-and-forget)
          python3 tools/build/patch_noop.py "$SO" 0x9cd1e0
          #  Ngsm.NGSM.ngsmRun  -> ret   (called from U_Lobby_Loading.RequestNGSM, lobby)
          python3 tools/build/patch_noop.py "$SO" 0x9cd2dc
          # Auto-press GUEST on the login-select screen: U_LoginSelect.View(true)
          # tail-calls init(); branch init -> LoginGuest so the moment the screen
          # shows it runs LoginGuest -> U_Lobby_Loading.CreateAccount ->
          # WWW_CreateAccount -> POST /game/create.php (embedded server). No
          # external Google/Facebook activity; straight to our create->login->myinfo.
          python3 tools/build/patch_branch.py "$SO" 0x1c31d94 0x1c31e78
          # Disable Facebook entirely at boot: FacebookManager.Awake -> ret.
          # OnInit is fire-and-forget (ActivateApp + a log; nothing gates on it),
          # so this kills FB.Init, the app-settings graph calls (the recurring
          # 400 for app id 1499779786990739 that a re-signed key can't validate)
          # and any FB web-login activity, without stalling boot.
          python3 tools/build/patch_noop.py "$SO" 0x1cd7d74
          # The connection_string callback (U_Logo.<PM_SetConnectionString>m__0)
          # wrongly took its error branch (traced O B M: LoadingBar, cb, error
          # popup) and never advanced to the lobby. Force the success branch:
          # its `cbz x21(err), success` at 0x1c336a8 -> unconditional `b success`
          # (0x1c33790), so it ignores the err verdict and runs SetDefaultUrl ->
          # LoadingBar -> PlayMakerFSM.SendEvent to load the lobby.
          python3 tools/build/patch_branch.py "$SO" 0x1c336a8 0x1c33790
          # Inline execution trace: hook boot/login method entries to append a
          # letter to /sdcard/reborn_trace.bin (game logging is stripped and the
          # app can't read the system log that says why it is torn down). Uses a
          # never-called example method as the code cave; assembled with llvm-mc.
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python3 tools/build/inline_trace.py "$SO" 0x1b7ccac
          patchelf --add-needed libreborn.so "$SO"
          readelf -dW "$SO" | grep -i needed | head

      - name: Assemble + sign the embedded APK
        run: |
          set -e
          python3 tools/build/build_embedded.py \
            dist/SpecialSoldier-reborn-3.4.7.apk \
            dist/main.347.com.wellgames.ss.obb \
            work/lib/arm64-v8a/libil2cpp.so \
            libreborn.so \
            embedded-unsigned.apk
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which jarsigner)")")")" \
            bash tools/build/repack_sign.sh embedded-unsigned.apk \
            SpecialSoldier-reborn-3.4.7-embedded.apk \
            tools/build/reborn-release.keystore reborn2024 reborn
          ls -l SpecialSoldier-reborn-3.4.7-embedded.apk

      - name: Attach to release
        run: gh release upload "$TAG" SpecialSoldier-reborn-3.4.7-embedded.apk --clobber
