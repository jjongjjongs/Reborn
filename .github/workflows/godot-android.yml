name: Godot Android

on:
  workflow_dispatch:
  push:
    branches: [ccr-83ca7d7b-mbunos]
    paths:
      - 'game/**'
      - '.github/workflows/godot-android.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure signing + SDK (debug)
        env:
          HOME: /root
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}  JAVA_HOME=${JAVA_HOME:-<unset>}"
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}"
          echo "using SDK=$SDK  JAVA=$JAVA"
          mkdir -p /root/.config/godot
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
              -deststoretype pkcs12
          fi
          echo "keystore: $(ls -la /root/debug.keystore)"
          cat > /root/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp /root/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.3.tres
          echo "--- export template files (4.3.stable) ---"
          ls -la /root/.local/share/godot/export_templates/4.3.stable/ || true
          echo "--- ensure Android platform/build-tools for target SDK 34 ---"
          SDKMGR="$(command -v sdkmanager || true)"
          [ -z "$SDKMGR" ] && SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -4 || true
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true

      - name: Import + export APK
        env:
          HOME: /root
        run: |
          set -e
          cd game
          mkdir -p build
          CODE=$(grep 'version/code' export_presets.cfg | grep -o '[0-9]\+' | head -1)
          VER=$(grep 'version/name' export_presets.cfg | cut -d'"' -f2)
          APK="reborn-v${CODE}.apk"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          # install Android build template (custom gradle build for in-app updater)
          TPLDIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "templates:"; ls -la "$TPLDIR" 2>/dev/null | grep -i android || echo "  (no android template found)"
          rm -rf android
          mkdir -p android/build
          unzip -q -o "$TPLDIR/android_source.zip" -d android/build
          touch android/.gdignore
          echo -n "4.3.stable" > android/.build_version   # what the editor's installer writes
          # in-app updater plugin: source + manifest registration
          # (FileProvider: godot-lib already declares ${applicationId}.fileprovider covering files dir)
          mkdir -p android/build/src/com/reborn/updater
          cp android_plugin/RebornUpdater.java android/build/src/com/reborn/updater/
          sed -i 's#</application>#    <meta-data android:name="org.godotengine.plugin.v2.RebornUpdater" android:value="com.reborn.updater.RebornUpdater" />\n    </application>#' android/build/AndroidManifest.xml
          # Godot ignores permissions/request_install_packages -> declare it in the manifest directly
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n\n    <application#' android/build/AndroidManifest.xml
          echo "--- manifest patch ---"; grep -n "reborn" android/build/AndroidManifest.xml
          echo "--- android/build installed: $(find android/build -maxdepth 1 | wc -l) top entries ---"
          java -version 2>&1 | head -1
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" "build/$APK"
          echo "--- build dir ---"
          ls -la build
          echo "--- merged manifest has updater? ---"
          M=$(find android/build/build -name AndroidManifest.xml -path "*merged_manifest*" 2>/dev/null | head -1)
          [ -n "$M" ] && grep -E "fileprovider|RebornUpdater|REQUEST_INSTALL_PACKAGES" "$M" || echo "(merged manifest not found)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: game/build/${{ env.APK }}

      - name: Remove old release assets (keep only this build)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'game-latest';
            const { owner, repo } = context.repo;
            let rel;
            try {
              rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              core.info('no existing release yet');
              return;
            }
            for (const a of rel.data.assets) {
              core.info('deleting old asset: ' + a.name);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-latest
          name: "Mini Soldier · v${{ env.CODE }} (${{ env.VER }})"
          body: "Godot 4.3 · 오프라인. 최신: ${{ env.APK }} 설치. 메뉴에서 PvE 서바이벌 / 데스매치 선택. (파일명 버전 숫자가 클수록 최신)"
          files: game/build/${{ env.APK }}
          fail_on_unmatched_files: true
